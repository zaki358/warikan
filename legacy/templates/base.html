<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}割り勘アプリ{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 480px; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; color: #1a1a2e; margin-bottom: 6px; }
    h2 { font-size: 1rem; color: #444; margin-bottom: 14px; font-weight: 600; }
    p.sub { color: #777; font-size: 0.875rem; margin-bottom: 20px; }
    .step-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: #5b8dee;
      background: #eef3fd;
      border-radius: 20px;
      padding: 2px 10px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 5px; font-weight: 500; }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
    }
    input:focus, select:focus { border-color: #5b8dee; }
    .form-group { margin-bottom: 16px; }
    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 14px 0; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #5b8dee; color: #fff; }
    .btn-primary:hover { background: #4a7de0; }
    .btn-secondary { background: #f0f0f0; color: #555; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-success { background: #dcfce7; color: #16a34a; }
    .btn-sm {
      display: inline-block;
      width: auto;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .actions .btn { flex: 1; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .tag-blue { background: #eef3fd; color: #5b8dee; }
    .tag-green { background: #dcfce7; color: #16a34a; }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
