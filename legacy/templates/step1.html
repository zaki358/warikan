{% extends "base.html" %}
{% block title %}設定 | 割り勘{% endblock %}

{% block extra_style %}
<style>
  .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .mode-card {
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }
  .mode-card input[type="radio"] { display: none; }
  .mode-card:has(input:checked) { border-color: #5b8dee; background: #eef3fd; }
  .mode-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
  .mode-label { font-size: 0.85rem; font-weight: 600; color: #333; }
  .mode-desc { font-size: 0.75rem; color: #888; margin-top: 2px; }
</style>
{% endblock %}

{% block content %}
<div class="card" style="margin-top:8px;">
  <div class="step-badge">Step 1 / 3</div>
  <h1>設定</h1>
  <p class="sub">タイトル・人数・モードを選んでください</p>

  <form method="post">
    <div class="form-group">
      <label for="title">タイトル（任意）</label>
      <input type="text" id="title" name="title" placeholder="例：飲み会 5/13">
    </div>

    <div class="form-group">
      <label for="count">人数</label>
      <input type="number" id="count" name="count" min="2" max="20" value="3" required>
    </div>

    <div class="form-group">
      <label>モード</label>
      <div class="mode-options">
        <label class="mode-card">
          <input type="radio" name="mode" value="simple" checked>
          <span class="mode-icon">🪙</span>
          <div class="mode-label">シンプル</div>
          <div class="mode-desc">各自の支払い額を入力</div>
        </label>
        <label class="mode-card">
          <input type="radio" name="mode" value="items">
          <span class="mode-icon">🧾</span>
          <div class="mode-label">品目別</div>
          <div class="mode-desc">品目ごとに誰が払ったか</div>
        </label>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-secondary">← トップ</a>
      <button type="submit" class="btn btn-primary">次へ →</button>
    </div>
  </form>
</div>
{% endblock %}
