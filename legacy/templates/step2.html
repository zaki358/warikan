<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>割り勘アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 40px; width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #333; }
    p { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
    .step { font-size: 0.8rem; color: #aaa; margin-bottom: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 4px; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: #5b8dee; }
    .hint { font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
    .divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .btn-back { background: #f0f0f0; color: #555; }
    .btn-next { background: #5b8dee; color: #fff; }
    .btn-next:hover { background: #4a7de0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="step">Step 2 / 3</div>
    <h1>名前と支払い金額</h1>
    <p>各自の名前と、実際に支払った金額を入力してください。<br>支払っていない場合は 0 でOKです。</p>
    <form method="post">
      {% for i in range(count) %}
      <div class="row">
        <div>
          <label for="name_{{ i }}">名前 {{ i + 1 }}</label>
          <input type="text" id="name_{{ i }}" name="name_{{ i }}" placeholder="例: 田中" required>
        </div>
        <div>
          <label for="paid_{{ i }}">支払い額（円）</label>
          <input type="number" id="paid_{{ i }}" name="paid_{{ i }}" min="0" value="0" required>
        </div>
      </div>
      {% if not loop.last %}
      <hr class="divider">
      {% endif %}
      {% endfor %}
      <div class="actions">
        <a href="/"><button type="button" class="btn-back">← 戻る</button></a>
        <button type="submit" class="btn-next">計算する →</button>
      </div>
    </form>
  </div>
</body>
</html>
