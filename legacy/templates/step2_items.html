{% extends "base.html" %}
{% block title %}品目入力 | 割り勘{% endblock %}

{% block extra_style %}
<style>
  .member-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 10px; }
  .item-add-row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-bottom: 8px; }
  .item-list { list-style: none; margin-top: 12px; }
  .item-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.9rem;
  }
  .item-entry:last-child { border-bottom: none; }
  .item-name { flex: 1; font-weight: 500; color: #222; }
  .item-amount { color: #5b8dee; font-weight: 700; white-space: nowrap; }
  .item-by { font-size: 0.8rem; color: #888; white-space: nowrap; }
  .remove-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 4px;
  }
  .remove-btn:hover { color: #dc2626; }
  .add-btn {
    background: #5b8dee;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .empty-items { text-align: center; color: #ccc; font-size: 0.85rem; padding: 16px 0; }
  .total-preview { text-align: right; font-size: 0.85rem; color: #888; margin-top: 8px; }
  .total-preview span { color: #5b8dee; font-weight: 700; }
</style>
{% endblock %}

{% block content %}
<div class="card" style="margin-top:8px;">
  <div class="step-badge">Step 2 / 3 — 品目別モード</div>
  <h1>メンバーと品目</h1>
  <p class="sub">名前を入力し、品目を追加してください</p>

  <form method="post" id="mainForm">
    <!-- メンバー名 -->
    <h2>👥 メンバー</h2>
    {% for i in range(count) %}
    <div class="member-row">
      <div>
        <label>名前 {{ i + 1 }}</label>
        <input type="text" name="name_{{ i }}" id="name_{{ i }}"
          value="{{ members[i].name if members and i < members|length else '' }}"
          placeholder="例：田中" required oninput="updateNames()">
      </div>
    </div>
    {% endfor %}

    <hr class="divider">

    <!-- 品目追加 -->
    <h2 style="margin-top:4px;">🧾 品目</h2>
    <div class="item-add-row">
      <input type="text" id="new_item_name" placeholder="品目名（例：ビール代）">
      <input type="number" id="new_item_amount" placeholder="金額" min="0">
    </div>
    <div style="margin-bottom:10px;">
      <label>支払った人</label>
      <div style="display:flex; gap:8px;">
        <select id="new_paid_by" style="flex:1;"></select>
        <button type="button" class="add-btn" onclick="addItem()">＋ 追加</button>
      </div>
    </div>

    <!-- 品目リスト -->
    <ul class="item-list" id="itemList"></ul>
    <div class="total-preview" id="totalPreview"></div>

    <!-- 隠しフィールド（サーバーへの送信用） -->
    <input type="hidden" name="item_count" id="item_count" value="0">
    <div id="hiddenItems"></div>

    <div class="actions" style="margin-top:20px;">
      <a href="/step1" class="btn btn-secondary">← 戻る</a>
      <button type="submit" class="btn btn-primary" onclick="return validateItems()">計算する →</button>
    </div>
  </form>
</div>

<script>
  const COUNT = {{ count }};
  const INITIAL_ITEMS = {{ items | tojson }};
  let items = [...INITIAL_ITEMS];
  let names = [];

  function updateNames() {
    names = [];
    for (let i = 0; i < COUNT; i++) {
      const v = document.getElementById(`name_${i}`)?.value.trim();
      names.push(v || `メンバー${i+1}`);
    }
    const sel = document.getElementById('new_paid_by');
    const cur = sel.value;
    sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
    if (names.includes(cur)) sel.value = cur;
  }

  function addItem() {
    const name = document.getElementById('new_item_name').value.trim();
    const amount = parseInt(document.getElementById('new_item_amount').value);
    const paid_by = document.getElementById('new_paid_by').value;
    if (!name) { alert('品目名を入力してください'); return; }
    if (!amount || amount <= 0) { alert('金額を入力してください'); return; }
    items.push({ name, amount, paid_by });
    document.getElementById('new_item_name').value = '';
    document.getElementById('new_item_amount').value = '';
    renderItems();
  }

  function removeItem(idx) {
    items.splice(idx, 1);
    renderItems();
  }

  function renderItems() {
    const list = document.getElementById('itemList');
    if (items.length === 0) {
      list.innerHTML = '<li class="empty-items">品目がまだありません</li>';
    } else {
      list.innerHTML = items.map((item, i) => `
        <li class="item-entry">
          <span class="item-name">${item.name}</span>
          <span class="item-by">${item.paid_by}</span>
          <span class="item-amount">¥${item.amount.toLocaleString()}</span>
          <button type="button" class="remove-btn" onclick="removeItem(${i})">✕</button>
        </li>
      `).join('');
    }

    const total = items.reduce((s, i) => s + i.amount, 0);
    document.getElementById('totalPreview').innerHTML =
      total > 0 ? `合計: <span>¥${total.toLocaleString()}</span>` : '';

    document.getElementById('item_count').value = items.length;
    document.getElementById('hiddenItems').innerHTML = items.map((item, i) => `
      <input type="hidden" name="item_name_${i}" value="${item.name}">
      <input type="hidden" name="item_amount_${i}" value="${item.amount}">
      <input type="hidden" name="item_paid_by_${i}" value="${item.paid_by}">
    `).join('');
  }

  function validateItems() {
    if (items.length === 0) { alert('品目を1つ以上追加してください'); return false; }
    return true;
  }

  updateNames();
  renderItems();
</script>
{% endblock %}
